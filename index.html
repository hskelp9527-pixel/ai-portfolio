<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任泓雨 | AI 应用工程师</title>
    <meta name="description" content="任泓雨的 AI 沉浸式个人简历 - 节点图谱 + AI 导览">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://puhuiti.oss-cn-hangzhou.aliyuncs.com">

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: oklch(0.12 0.02 250);
            color: oklch(0.95 0.01 250);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body.dark-theme {
            background: oklch(0.04 0.01 250);
        }
        #root:empty::after {
            content: 'Initializing Neural Canvas...';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 13px;
            letter-spacing: 0.1em;
            color: oklch(0.55 0.02 250);
            animation: boot-pulse 1.4s ease-in-out infinite;
        }
        @keyframes boot-pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>

    <div id="root"></div>
